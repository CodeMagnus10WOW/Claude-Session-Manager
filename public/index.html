<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0c1631;
    --night-deep: #070d22;
    --panel: #121e40;
    --panel-2: #182752;
    --rule: #263766;
    --parchment: #efe6cf;
    --text-2: #c3c8db;
    --dim: #8e97b5;
    --faint: #5d688c;
    --brass: #c9a86a;
    --aurora: #7ee8c8;
    --rose: #f0a0a0;
    --sky-blue: #8fb8ea;
    --top: 52px;
    --k: 1;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Instrument Sans", system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night-deep); color: var(--parchment);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* ---------- Kopfleiste ---------- */
  .top { position: fixed; z-index: 20; left: 0; right: 0; top: 0; height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px;
    background: rgba(9, 16, 38, .96); border-bottom: 1px solid var(--rule); }
  .top h1 { margin: 0 6px 0 0; font: italic 600 22px/1 var(--serif); white-space: nowrap; }
  .modes { display: flex; background: rgba(18, 30, 64, .9); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; }
  .tab { background: none; border: 0; border-radius: 6px; padding: 4px 12px; color: var(--dim); cursor: pointer; font-size: 13px; }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--parchment); }
  .counts { display: flex; gap: 6px; margin-left: 8px; }
  .count { display: inline-flex; align-items: baseline; gap: 5px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 3px 9px;
    color: var(--dim); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .count b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .count:hover { border-color: var(--rule); color: var(--text-2); }
  .count[aria-pressed="true"] { border-color: var(--rule); background: var(--panel-2); color: var(--parchment); }
  .count.ask b { color: var(--brass); } .count.warn b { color: var(--rose); } .count.on b { color: var(--sky-blue); } .count.done b { color: var(--aurora); }
  .count.zero b { color: var(--faint); }
  .spacer { flex: 1; }
  .btn { background: rgba(18, 30, 64, .85); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 11px; cursor: pointer;
    color: var(--text-2); white-space: nowrap; font-size: 13px; }
  .btn:hover { border-color: var(--brass); color: var(--parchment); }
  .btn[aria-pressed="true"] { border-color: var(--aurora); color: var(--aurora); }
  .btn kbd { font: 11px var(--sans); color: var(--faint); margin-left: 6px; }
  .btn.primary { background: var(--brass); border-color: var(--brass); color: #1a1405; font-weight: 600; }
  .btn.primary:hover { background: #d8b97b; color: #1a1405; }
  .btn:disabled { opacity: .45; cursor: default; }
  body.mode-cockpit .map-only, body.mode-map .cockpit-only { display: none !important; }

  /* ---------- Cockpit-Raster ---------- */
  #cockpit { display: contents; }
  #center { display: contents; }
  body.mode-cockpit #cockpit { display: grid; grid-template-columns: 340px minmax(0, 1fr); position: fixed; inset: var(--top) 0 0 0; }
  body.mode-cockpit #center { display: block; position: relative; min-width: 0; overflow: hidden; }
  body.mode-cockpit #sky, body.mode-cockpit #stage, body.mode-cockpit #chart, body.mode-cockpit .zoom, body.mode-cockpit .hint,
  body.mode-cockpit .tour, body.mode-cockpit #tip { display: none !important; }
  body.mode-map #overview { display: none !important; }

  /* ---------- Übersicht (Kacheln) ---------- */
  #overview { position: absolute; inset: 0; overflow-y: auto; padding: 18px 22px 40px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  body.mode-cockpit #center.showing-log #overview { display: none; }
  .ov-sect { margin: 0 0 22px; }
  .ov-sect h2 { margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; font: italic 600 20px/1.2 var(--serif); color: var(--c); }
  .ov-sect h2 small { font: 500 12px var(--sans); color: var(--faint); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 6px; text-align: left; background: linear-gradient(180deg, rgba(24, 39, 82, .7), rgba(16, 27, 58, .8));
    border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px 12px; cursor: pointer; color: inherit; position: relative; min-height: 120px; }
  .tile::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--c); }
  .tile:hover { border-color: color-mix(in srgb, var(--c) 60%, var(--rule)); }
  .tile.sel { border-color: var(--brass); }
  .tile-top { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); }
  .tile-top .proj { margin-left: auto; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile h3 { margin: 0; font: 600 18px/1.15 var(--serif); color: var(--parchment); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .det { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tile.ask .det { color: var(--parchment); }
  .tile .note { margin: 0; font-size: 12px; color: var(--brass); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .note::before { content: "Notiz: "; color: var(--faint); }
  .plan-bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .plan-bar i { display: block; height: 100%; background: var(--c); }
  .plan-line { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
  .tile-actions .btn { padding: 4px 9px; font-size: 12px; }
  .ov-empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .ov-empty strong { display: block; font: italic 600 26px var(--serif); color: var(--parchment); margin-bottom: 6px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
    border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); color: var(--c); white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .ask .badge::before, .on .badge::before { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .ask { --c: var(--brass); } .warn { --c: var(--rose); } .on { --c: var(--sky-blue); } .done { --c: var(--aurora); } .idle { --c: var(--dim); }

  /* ---------- Liste ---------- */
  #side { position: fixed; z-index: 12; left: 16px; top: calc(var(--top) + 14px); bottom: 66px; width: 340px; display: none; flex-direction: column;
    background: rgba(12, 21, 48, .93); border: 1px solid var(--rule); border-radius: 12px; backdrop-filter: blur(8px); overflow: hidden; }
  body.mode-map.side-open #side { display: flex; }
  body.mode-cockpit #side { position: static; display: flex; width: auto; border: 0; border-right: 1px solid var(--rule); border-radius: 0; backdrop-filter: none;
    background: rgba(9, 16, 38, .6); }
  .side-head { padding: 10px 12px 10px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
  .side-head input, .side-head select, .modal select, .modal input, .modal textarea, #noteInput {
    width: 100%; background: rgba(18, 30, 64, .9); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; color: var(--parchment); outline: none; }
  .side-head input:focus, .modal input:focus, .modal textarea:focus, .modal select:focus, #noteInput:focus { border-color: var(--brass); }
  .side-head .pair { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .side-head select { padding: 5px 6px; font-size: 12px; color: var(--text-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule); background: none; color: var(--text-2); cursor: pointer; }
  .chip:hover { border-color: var(--dim); }
  .chip[aria-pressed="true"] { border-color: var(--brass); color: var(--parchment); background: rgba(201,168,106,.14); }
  .chip b { font-weight: 600; color: var(--brass); margin-left: 4px; }
  .side-list { flex: 1; overflow-y: auto; padding: 4px 6px 8px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .grp { display: flex; align-items: center; gap: 8px; padding: 12px 8px 4px; }
  .grp span { font: italic 600 17px/1.2 var(--serif); color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp small { color: var(--faint); font-size: 11px; }
  .grp button { margin-left: auto; background: none; border: 1px solid var(--rule); border-radius: 6px; color: var(--dim); font-size: 11.5px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  .grp button:hover { color: var(--parchment); border-color: var(--brass); }
  .item { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 1px; align-items: center; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 8px; cursor: pointer; color: inherit; }
  .item:hover { background: rgba(24, 39, 82, .7); }
  .item.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--brass); }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .item.ask .dot { animation: pulse 1.4s infinite; }
  .item strong { font-weight: 550; font-size: 13.5px; color: var(--parchment); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { grid-column: 2 / 4; color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small.det { color: var(--text-2); }
  .item.ask small.det { color: var(--brass); }
  .item.warn small.det { color: var(--rose); }
  .item small.note { color: var(--brass); }
  .item small.note::before { content: "Notiz: "; color: var(--faint); }
  .item small.split, .tile-top .split { color: var(--rose); white-space: nowrap; }
  .item .key { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
  .side-empty { padding: 18px 10px; color: var(--dim); font-size: 13px; }
  .side-empty button { margin-top: 8px; }
  .side-foot { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--faint); }
  .side-foot .btn { margin-left: auto; padding: 5px 10px; font-size: 12.5px; }

  /* ---------- Session (Logbuch / Arbeitsfläche) ---------- */
  #log { position: fixed; top: var(--top); right: 0; bottom: 0; width: min(600px, 100vw); z-index: 25; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #13204a, #0d1838); border-left: 1px solid var(--rule);
    transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  #log.open { transform: none; box-shadow: -30px 0 80px rgba(0,0,0,.55); }
  body.mode-cockpit #log { position: absolute; inset: 0; width: auto; transform: none; transition: none; border-left: 0; box-shadow: none; display: none; }
  body.mode-cockpit #log.open { display: flex; }
  #log header { padding: 14px 22px 12px; border-bottom: 1px solid var(--rule); position: relative; }
  #log header::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--c), transparent); }
  #log h2 { margin: 2px 40px 2px 0; font: 600 26px/1.1 var(--serif); }
  #log .close { position: absolute; top: 10px; right: 12px; background: none; border: 1px solid transparent; border-radius: 8px; font-size: 13px;
    color: var(--dim); cursor: pointer; padding: 4px 10px; }
  #log .close:hover { color: var(--parchment); border-color: var(--rule); }
  /* Platz für den absolut positionierten Übersicht-Knopf, sonst überlagert er die Zeitangabe */
  #log .card-kicker { margin-right: 84px; }
  /* Eine Zeile mit Anfang … Ende des Pfads; der volle Pfad steht im Tooltip */
  #log .path { color: var(--faint); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .card-kicker { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .card-kicker .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
  .card-kicker .proj { color: color-mix(in srgb, var(--c) 75%, var(--parchment)); font-weight: 500; }
  .card-kicker .when { margin-left: auto; white-space: nowrap; }
  .pstate { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-2); line-height: 1.4; }
  .pstate .since { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .pstate.ask .det { color: var(--parchment); }
  #paneReplies { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #paneReplies .btn { border-color: color-mix(in srgb, var(--brass) 55%, var(--rule)); color: var(--parchment); }
  #panePlan { margin-top: 10px; font-size: 12.5px; }
  #panePlan summary { cursor: pointer; color: var(--dim); }
  #panePlan summary b { color: var(--parchment); font-weight: 600; }
  #panePlan ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
  #panePlan li { display: flex; gap: 8px; align-items: baseline; color: var(--dim); }
  #panePlan li i { font-style: normal; width: 14px; text-align: center; flex: none; color: var(--faint); }
  #panePlan li.done { text-decoration: line-through; color: var(--faint); }
  #panePlan li.cur { color: var(--parchment); } #panePlan li.cur i { color: var(--brass); }
  #log .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #log .actions .btn { padding: 5px 10px; font-size: 12.5px; }
  #log .facts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
  #log .facts div { font-size: 11px; color: var(--dim); }
  #log .facts b { display: block; color: var(--parchment); font-size: 13.5px; font-weight: 600; }
  #logMore { margin-top: 10px; font-size: 12.5px; }
  #logMore > summary { cursor: pointer; color: var(--dim); }
  #logMore > summary:hover { color: var(--parchment); }
  #noteInput { margin-top: 8px; resize: vertical; min-height: 40px; font-size: 13px; }
  #logFiles { margin-top: 10px; font-size: 12.5px; }
  #logFiles summary { cursor: pointer; color: var(--text-2); }
  #logFiles .flist { max-height: 180px; overflow-y: auto; margin-top: 6px; display: grid; gap: 2px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  #logFiles button { display: flex; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 6px; padding: 3px 6px;
    color: var(--text-2); cursor: pointer; font: 12px var(--mono); }
  #logFiles button:hover { background: var(--panel-2); color: var(--parchment); }
  #logFiles button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  #logFiles button small { color: var(--faint); font: 11px var(--sans); white-space: nowrap; }
  #log .stream { flex: 1; overflow-y: auto; padding: 18px 22px 40px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  #log .older { color: var(--faint); font-size: 12px; margin: 0 0 12px; }
  #log .msg { font-size: 13.5px; }
  #log .msg .who { display: block; font-size: 11px; color: var(--faint); margin-bottom: 3px; }
  #log .msg.live { color: var(--parchment); }
  #log .msg.live::after { content: ""; display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; background: var(--brass); animation: pulse .9s infinite; }
  #log .msg.sending { opacity: .6; }
  #log .msg.hit { outline: 2px solid var(--brass); outline-offset: 4px; border-radius: 6px; animation: hit 2.4s ease-out; }
  @keyframes hit { 0% { background: rgba(201,168,106,.25); } 100% { background: transparent; } }
  #log details.tools { color: var(--faint); font-size: 12px; margin: 0 0 10px; }
  #log details.tools summary { cursor: pointer; color: var(--dim); }
  #log details.tools div { padding: 4px 0 0 14px; font-family: var(--mono); font-size: 11px; line-height: 1.6; word-break: break-all; }

  .msg { font-size: 12.5px; line-height: 1.5; margin: 0 0 10px; word-break: break-word; color: var(--text-2); }
  .msg.user { color: var(--parchment); background: color-mix(in srgb, var(--c) 13%, transparent);
    border-left: 2px solid var(--c); padding: 6px 10px; border-radius: 0 8px 8px 0; }
  .msg.tools { color: var(--faint); font-size: 11.5px; }
  .msg.tools i { font-style: normal; color: var(--dim); }
  .msg pre { background: rgba(0,0,0,.28); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; overflow-x: auto;
    font: 11.5px/1.45 var(--mono); color: var(--text-2); margin: 6px 0; white-space: pre; }
  .msg code { font: 0.92em var(--mono); background: rgba(0,0,0,.25); padding: 0 4px; border-radius: 4px; }
  .msg h4 { font: 600 1.05em var(--sans); margin: 8px 0 2px; color: var(--parchment); }
  .msg p { margin: 0 0 6px; }
  .msg ul { margin: 0 0 6px; padding-left: 18px; }
  .msg mark { background: rgba(201,168,106,.4); color: var(--parchment); border-radius: 3px; padding: 0 2px; }

  /* ---------- Steuern ---------- */
  .console { border-top: 1px solid var(--rule); padding: 12px 18px 14px; background: rgba(7, 13, 34, .55); }
  .notice { font-size: 12.5px; line-height: 1.45; color: var(--text-2); border-left: 3px solid var(--brass); background: rgba(201,168,106,.08);
    padding: 8px 12px; border-radius: 0 8px 8px 0; margin-bottom: 10px; }
  .notice.error { border-left-color: var(--rose); background: rgba(240,160,160,.08); }
  .perm { border: 1px solid var(--brass); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: rgba(201,168,106,.07); }
  .perm h3 { margin: 0 0 6px; font: 600 15px/1.3 var(--sans); color: var(--parchment); }
  .perm h3 b { color: var(--brass); }
  .perm pre { margin: 0 0 10px; max-height: 160px; overflow: auto; background: rgba(0,0,0,.3); border: 1px solid var(--rule); border-radius: 6px;
    padding: 8px 10px; font: 11.5px/1.45 var(--mono); color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
  .perm .q { margin: 0 0 10px; font-size: 13px; }
  .perm .q p { margin: 0 0 6px; color: var(--parchment); }
  .perm .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .perm .opts button[aria-pressed="true"] { border-color: var(--aurora); color: var(--aurora); }
  .perm .row { display: flex; gap: 8px; justify-content: flex-end; }
  #composer textarea { width: 100%; resize: none; min-height: 44px; max-height: 180px; background: rgba(18, 30, 64, .9); border: 1px solid var(--rule);
    border-radius: 10px; padding: 10px 12px; color: var(--parchment); line-height: 1.45; outline: none; }
  #composer textarea:focus { border-color: var(--brass); }
  .crow { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .crow select { background: rgba(18, 30, 64, .9); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; color: var(--text-2); }
  .crow .state { flex: 1; min-width: 120px; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .state.on { color: var(--aurora); }
  .crow .state.ask { color: var(--brass); }

  /* ---------- Suche ---------- */
  #finder { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(4, 8, 22, .55); backdrop-filter: blur(3px); }
  #finder.open { display: block; }
  .finder-box { position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); width: min(600px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .finder-box input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 16px 18px; font-size: 17px; outline: none; }
  .finder-box ul { list-style: none; margin: 0; padding: 6px; max-height: 55vh; overflow-y: auto; }
  .finder-box li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
  .finder-box li[aria-selected="true"] { background: var(--panel-2); }
  .finder-box li .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
  .finder-box li strong { font: 600 17px/1.2 var(--serif); display: block; }
  .finder-box li small { color: var(--dim); font-size: 12px; }
  .finder-box li .age { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
  .finder-box .none { padding: 14px; color: var(--dim); }
  .finder-box .sect { padding: 10px 12px 4px; font-size: 11.5px; color: var(--faint); list-style: none; cursor: default; }
  .finder-box li .snip { color: var(--text-2); font-size: 12.5px; line-height: 1.4; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .finder-box li mark { background: rgba(201,168,106,.3); color: var(--parchment); border-radius: 3px; padding: 0 2px; }

  /* ---------- Neue Session ---------- */
  .modal { position: fixed; inset: 0; z-index: 35; display: none; background: rgba(4, 8, 22, .6); backdrop-filter: blur(3px); }
  .modal.open { display: block; }
  .modal-box { position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); display: grid; gap: 12px; }
  .modal h2 { margin: 0; font: italic 600 26px/1.1 var(--serif); }
  .modal label { display: grid; gap: 5px; font-size: 12.5px; color: var(--dim); }
  .modal textarea { resize: vertical; min-height: 96px; line-height: 1.45; }

  /* ---------- Funksprüche ---------- */
  .feed { position: fixed; z-index: 18; top: calc(var(--top) + 12px); right: 16px; width: 300px; display: flex; flex-direction: column; gap: 8px; }
  .ping { text-align: left; background: rgba(18, 30, 64, .94); border: 1px solid var(--rule); border-left: 3px solid var(--c);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; animation: ping-in .35s ease-out; transition: opacity .6s; backdrop-filter: blur(6px); color: inherit; }
  .ping:hover { border-color: var(--brass); border-left-color: var(--c); }
  .ping strong { display: block; font: 600 16px/1.2 var(--serif); color: var(--parchment); }
  .ping span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; color: var(--dim); }
  .ping.gone { opacity: 0; }
  @keyframes ping-in { from { transform: translateX(16px); opacity: 0; } }

  /* ---------- Karte ---------- */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #stage.panning { cursor: grabbing; }
  #stage.over-star { cursor: pointer; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
  .card { position: absolute; width: 380px; height: 300px; border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer;
    background: linear-gradient(180deg, rgba(24, 39, 82, .96), rgba(16, 27, 58, .96));
    border: 1px solid color-mix(in srgb, var(--c) 28%, var(--rule));
    box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 18px 40px -12px rgba(0,0,0,.6), 0 0 60px -20px color-mix(in srgb, var(--c) 50%, transparent); }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--c), transparent); }
  .card.selected { border-color: var(--brass); box-shadow: 0 0 0 calc(1.5px / var(--k)) var(--brass), 0 18px 40px -12px rgba(0,0,0,.6); }
  .card.dim { opacity: .1; pointer-events: none; }
  .card.live { border-color: color-mix(in srgb, var(--aurora) 55%, var(--rule)); }
  .card.asking { border-color: var(--brass); }
  .card.flare { animation: flare 1.6s ease-out; }
  @keyframes flare {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 90%, transparent), 0 0 80px 10px color-mix(in srgb, var(--c) 60%, transparent); }
    100% { box-shadow: 0 0 0 calc(40px / var(--k)) transparent, 0 0 60px -20px transparent; }
  }
  .card-head { padding: 16px 18px 6px; }
  .card-title { font-family: var(--serif); font-weight: 600; font-size: 25px; line-height: 1.08; margin-top: 6px; color: var(--parchment);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .live-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--aurora); font-size: 12px; font-weight: 500; }
  .live-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--aurora); box-shadow: 0 0 8px var(--aurora); animation: pulse 1.6s infinite; }
  .ask-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--brass); font-size: 12px; font-weight: 600; }
  .ask-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 8px var(--brass); animation: pulse 1s infinite; }
  .card-body { flex: 1; min-height: 0; padding: 4px 18px 0; position: relative; }
  .summary { height: 100%; display: flex; flex-direction: column; gap: 10px; }
  .prompt { color: var(--text-2); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .curve { height: 46px; flex: none; }
  .curve svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .figures { display: flex; gap: 18px; margin-top: auto; padding-bottom: 12px; }
  .fig b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--parchment); line-height: 1.2; }
  .fig span { font-size: 11px; color: var(--dim); }
  .fig.extra b { color: var(--text-2); }
  .preview { display: none; position: absolute; inset: 0 0 0 0; padding: 4px 18px 14px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  .z-near .summary { display: none; }
  .z-near .preview { display: block; }
  .z-near .card-title { -webkit-line-clamp: 1; font-size: 21px; }
  .card .msg .clip { display: -webkit-box; -webkit-line-clamp: 10; -webkit-box-orient: vertical; overflow: hidden; }
  .card-foot { display: flex; align-items: center; gap: 10px; padding: 9px 18px 11px; font-size: 11.5px; color: var(--faint);
    border-top: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
  .card-foot code { font-family: var(--mono); font-size: 11px; }
  .card-foot button[data-open] { margin-left: auto; }
  .card-foot button[data-log] { color: var(--parchment); border-color: color-mix(in srgb, var(--brass) 55%, var(--rule)); }
  .card-foot button { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; color: var(--text-2); cursor: pointer; }
  .card-foot button:hover { border-color: var(--brass); color: var(--parchment); }
  .zoom { position: fixed; z-index: 10; left: 18px; bottom: 18px; display: flex; align-items: center; background: rgba(18, 30, 64, .85); border: 1px solid var(--rule);
    border-radius: 8px; overflow: hidden; backdrop-filter: blur(6px); }
  .zoom button { background: none; border: 0; padding: 7px 12px; cursor: pointer; color: var(--text-2); }
  .zoom button:hover { background: var(--panel-2); color: var(--parchment); }
  .zoom output { min-width: 50px; text-align: center; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  #chart { position: fixed; z-index: 10; right: 18px; bottom: 18px; width: 168px; height: 168px; border-radius: 50%; cursor: crosshair;
    background: radial-gradient(circle, rgba(24,39,82,.92), rgba(12,22,49,.92)); border: 1px solid var(--rule); }
  .tour { position: fixed; z-index: 10; left: 50%; bottom: 22px; transform: translateX(-50%); text-align: center; pointer-events: none;
    background: rgba(7, 13, 34, .82); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 18px; backdrop-filter: blur(6px); }
  .tour strong { display: block; font: italic 600 20px/1.2 var(--serif); }
  .tour span { font-size: 12px; color: var(--dim); }
  .hint { position: fixed; z-index: 10; left: 50%; bottom: 22px; transform: translateX(-50%); color: var(--faint); font-size: 12px; white-space: nowrap; pointer-events: none; }
  #tip { position: fixed; z-index: 15; pointer-events: none; max-width: 280px; background: rgba(7, 13, 34, .94);
    border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; transform: translate(14px, 14px); display: none; }
  #tip strong { display: block; font: 600 18px/1.15 var(--serif); }
  #tip .meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
  #tip .meta .on { color: var(--aurora); }
  #tip p { margin: 6px 0 0; font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .empty { position: fixed; inset: var(--top) 0 0 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 16px; z-index: 5; }
  .empty strong { display: block; font: italic 600 28px var(--serif); color: var(--parchment); }

  @media (max-width: 900px) {
    .top { gap: 6px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
    .top::-webkit-scrollbar { display: none; }
    .top > * { flex: none; }
    .spacer { flex: 1 0 8px; }
    .top h1 { font-size: 18px; }
    .counts .count span { display: none; }
    .btn kbd { display: none; }
    body.mode-cockpit #cockpit { grid-template-columns: 1fr; }
    body.mode-cockpit #center { display: none; }
    body.mode-cockpit #center.showing-log { display: block; }
    body.mode-cockpit #center.showing-log ~ #side, body.mode-cockpit.pane-open #side { display: none; }
    .feed { display: none; }
    body.mode-map #side { left: 12px; right: 12px; width: auto; }
    .hint { display: none; }
    #chart { width: 110px; height: 110px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-tag::before, .ask-tag::before, .badge::before, .item .dot, .card.flare, .ping { animation: none; }
    #log { transition: none; }
  }
</style>
</head>
<body class="mode-cockpit">

<header class="top">
  <h1>Session Canvas</h1>
  <nav class="modes" role="tablist" aria-label="Ansicht">
    <button class="tab" id="mCockpit" role="tab" aria-selected="true">Cockpit</button>
    <button class="tab" id="mMap" role="tab" aria-selected="false">Karte</button>
  </nav>
  <div class="counts" id="counts"></div>
  <span class="spacer"></span>
  <button class="btn" id="bFind">Suchen<kbd>Strg K</kbd></button>

  <button class="btn map-only" id="bList" aria-pressed="false">Liste<kbd>L</kbd></button>
  <button class="btn map-only" id="bTour" aria-pressed="false">Rundflug<kbd>Leertaste</kbd></button>
  <button class="btn" id="bNotify" aria-pressed="false" title="Desktop-Benachrichtigung, sobald eine Session dich braucht">Benachrichtigen</button>
  <button class="btn" id="bSound" aria-pressed="false" title="Kurzer Ton, sobald eine Session dich braucht">Ton</button>
</header>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="stage" aria-label="Sternkarte deiner Sessions"><div id="world"></div></div>

<div id="cockpit">
  <aside id="side" aria-label="Liste aller Sessions">
    <div class="side-head">
      <input id="sText" type="search" placeholder="Filtern nach Titel, Projekt, Prompt" aria-label="Liste filtern" autocomplete="off">
      <div class="chips" id="sStatus" role="group" aria-label="Status">
        <button class="chip" data-status="all" aria-pressed="true">Alle</button>
        <button class="chip" data-status="needs" aria-pressed="false">Braucht dich</button>
        <button class="chip" data-status="working" aria-pressed="false">Arbeitet</button>
        <button class="chip" data-status="done" aria-pressed="false">Fertig</button>
        <button class="chip" data-status="connected" aria-pressed="false">Von hier gesteuert</button>
      </div>
      <div class="pair">
        <select id="sSince" aria-label="Zeitraum">
          <option value="all">Jederzeit</option><option value="day">24 Stunden</option><option value="week">7 Tage</option><option value="month">30 Tage</option>
        </select>
        <select id="sOrigin" aria-label="Entstanden in">
          <option value="all">Überall</option><option value="app">Claude-App</option><option value="vscode">VS Code</option><option value="terminal">Terminal</option>
        </select>
        <select id="sSort" aria-label="Gruppierung">
          <option value="state">Nach Status</option><option value="project">Projekte</option><option value="recent">Neueste</option><option value="prompts">Prompts</option><option value="tokens">Tokens</option>
        </select>
      </div>
    </div>
    <div class="side-list" id="sList"></div>
    <div class="side-foot"><span id="sCount"></span><button class="btn" id="sNew">Neue Session</button></div>
  </aside>

  <main id="center">
    <section id="overview" aria-label="Übersicht aller Sessions"></section>

    <aside id="log" aria-hidden="true">
      <header>
        <button class="close" id="logClose" title="Zur Übersicht (Esc)">Übersicht</button>
        <div class="card-kicker" id="logKicker"></div>
        <h2 id="logTitle"></h2>
        <div class="path" id="logPath"></div>
        <div class="pstate" id="paneState"></div>
        <div id="paneReplies" hidden></div>
        <details id="panePlan" hidden><summary></summary><ol></ol></details>
        <div class="actions">
          <button class="btn primary" id="logOpen">Öffnen</button>
          <button class="btn" id="logTerm" hidden>Im Terminal öffnen</button>
          <button class="btn" id="logArchive" hidden>Archivieren</button>
          <button class="btn" id="logZoom">Auf der Karte</button>
          <button class="btn" id="logCopy">Befehl kopieren</button>

        <details id="logMore">
          <summary id="logMoreSum">Notiz und Details</summary>
          <textarea id="noteInput" rows="2" placeholder="Notiz für dich: worum geht es hier, was ist der nächste Schritt?" aria-label="Notiz zu dieser Session"></textarea>
          <div class="facts" id="logFacts"></div>
          <details id="logFiles" hidden><summary></summary><div class="flist"></div></details>
        </details>

      <div class="stream" id="logStream"></div>
      <div class="console">

        <div id="notice"></div>
        <form id="composer" autocomplete="off">

          <div class="crow">

              <option value="claude-sonnet-5-5">Sonnet 5.5</option>

            <select id="cEffort" aria-label="Effort" title="Wie gründlich Claude nachdenkt. Ein Wechsel startet Claude für diese Session neu.">
              <option value="">Effort: Standard</option>
              <option value="low">Effort: low</option>
              <option value="medium">Effort: medium</option>
              <option value="high">Effort: high</option>
              <option value="xhigh">Effort: xhigh</option>

            <span class="state" id="cState"></span>
            <button type="button" class="btn" id="cStop" hidden>Stoppen</button>
            <button type="button" class="btn" id="cRelease" hidden title="Den Claude-Prozess dieser Session beenden">Trennen</button>

</div>

<div class="modal" id="newDlg" role="dialog" aria-label="Neue Session starten">
  <form class="modal-box" id="newForm" autocomplete="off">
    <h2>Neue Session</h2>

      <select id="nProj"></select>
    </label>
    <input id="nPath" placeholder="Pfad zum Ordner, z. B. D:\entwicklung vsc\mein-projekt" hidden aria-label="Pfad zum Ordner">
    <label>Was soll Claude tun?
      <textarea id="nText" placeholder="Zum Beispiel: Schau dir das Projekt an und schlag drei Verbesserungen vor."></textarea>
    </label>

      <select id="nMode" aria-label="Was Claude ohne Nachfrage darf">
        <option value="manual">Bei allem fragen</option>

<script>
(() => {
  // ---------- Konstanten ----------
  const CARD_W = 380, CARD_H = 300, CELL_W = 450, CELL_H = 370, CLUSTER_GAP = 220;
  const MIN_K = 0.03, MAX_K = 3;
  const CARD_IN = [0.40, 0.58];   // Zoombereich, in dem Sterne zu Karten werden
  const NEAR = 0.95;              // ab hier zeigen Karten den Verlauf
  const PALETTE = ["#7fb7e8", "#e39a7b", "#b49ae8", "#7fd1b9", "#e8c77f", "#e88fb2", "#a6cf86", "#8fa3f0", "#e8a2d8", "#6fc6e0"];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STATES = {
    needs_you: { label: "Braucht dich", cls: "ask", order: 0 },
    stalled: { label: "Hängt", cls: "warn", order: 1 },
    done: { label: "Fertig, ungelesen", cls: "done", order: 2 },
    working: { label: "Arbeitet", cls: "on", order: 3 },
    idle: { label: "Ruht", cls: "idle", order: 4 },
    archived: { label: "Archiviert", cls: "idle", order: 5 },
  };

  const $ = id => document.getElementById(id);
  const sky = $("sky"), ctx = sky.getContext("2d");
  const stage = $("stage"), world = $("world"), chart = $("chart");

  // ---------- Zustand ----------
  let sessions = [], byId = new Map();
  let nodes = new Map();      // id -> { s, x, y, cx, cy, c, el, cluster, flareAt, born }
  let clusters = [];          // { key, name, path, c, cx, cy, r, top, ids }
  let clusterOrder = [];
  let bounds = { x: 0, y: 0, w: 1, h: 1, r: 1 };
  const view = { x: innerWidth / 2, y: innerHeight / 2, k: 0.2 };
  let selectedId = null, hoverId = null, firstLoad = true, layoutKey = "";
  let introStart = 0;
  let serverSkew = 0;
  const TOKEN = "__CANVAS_TOKEN__"; // setzt der Server beim Ausliefern ein
  const runs = new Map();     // sid -> Zustand des von hier gesteuerten Claude-Prozesses
  const partials = new Map(); // sid -> Text, den Claude gerade schreibt
  const prevKinds = new Map(); // sid -> letzter bekannter Zustand (für Benachrichtigungen)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const notes = store.get("sc-notes", {});
  const prefs = store.get("sc-prefs", { notify: false, sound: false });
  const isCockpit = () => document.body.classList.contains("mode-cockpit");

  async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Canvas-Token": TOKEN }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Fehler ${r.status}`);
    return j;
  }
  const isBusy = r => !!r && (r.status === "working" || r.status === "starting");
  const isAsking = r => !!r && !!r.pending && r.pending.length > 0;
  // Läuft die Session gerade woanders (Claude-App, Terminal)? Dann könnten zwei Programme gleichzeitig schreiben.
  const elsewhere = s => !runs.has(s.id) && !s.ours && s.updatedMs && now() - s.updatedMs < 3 * 60 * 1000;
  const OPEN_LABEL = { app: "In Claude öffnen", vscode: "In VS Code öffnen", terminal: "Im Terminal öffnen" };
  const OPENED = { app: "öffnet sich in der Claude-App", vscode: "öffnet sich in VS Code", terminal: "öffnet sich in einem neuen Terminal" };
  const FROM = { app: "Claude-App", vscode: "VS Code", terminal: "Terminal" };
  function openHint(s) {
    const o = s.opener;
    if (o.archived) return "In der Claude-App archiviert, darum im Terminal mit claude --resume";
    if (o.kind === "terminal") return `Neues Terminal im Projektordner mit claude --resume`;
    return `Dort öffnen, wo die Session entstanden ist (${FROM[o.from]})`;
  }
  async function openElsewhere(id, target) {
    const s = byId.get(id);
    try {
      const r = await post(`/api/sessions/${encodeURIComponent(id)}/open`, { target });
      if (logId === id) { consoleError = ""; flashState(`Session ${OPENED[r.opened]}.`); }
      else pushFeed(id, s ? s.title : id, `Session ${OPENED[r.opened]}.`, () => goTo(id));
    } catch (err) {
      if (logId === id) { consoleError = err.message; renderConsole(); }
      else pushFeed(id, s ? s.title : id, `Öffnen ging nicht: ${err.message}`, () => openLog(id));
    }
  }

  // Zustand einer Session: der Server kennt Verlauf und App, hier kommt der Live-Prozess dazu
  function stateFor(s) {
    const r = runs.get(s.id);
    if (isAsking(r)) {
      const p = r.pending[0];
      return { kind: "needs_you", detail: p.tool === "AskUserQuestion" ? "Claude stellt dir eine Frage" : `Wartet auf deine Erlaubnis für ${p.display || p.tool}`,
        since: p.at, unread: false, actions: [], ours: true, pending: p };
    }
    if (isBusy(r)) return { kind: "working", detail: r.note || "Arbeitet …", since: null, unread: false, actions: [] };
    return s.state || { kind: "idle", detail: "", unread: false, actions: [] };
  }
  function runTag(s) {
    const st = stateFor(s), d = STATES[st.kind];
    if (st.kind === "idle" || st.kind === "archived") return "";
    return `<span class="${st.kind === "needs_you" ? "ask-tag" : "live-tag"}">${d.label}</span>`;
  }

  // ---------- Hilfen ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0; return h; }
  const rand = seed => () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) + 0x9e3779b9 >>> 0) / 4294967296);
  const now = () => Date.now() + serverSkew;
  function ago(t) {
    if (!t) return "–";
    const s = (now() - new Date(t)) / 1000;
    if (s < 45) return "gerade eben";
    if (s < 3600) return `vor ${Math.max(1, Math.round(s / 60))} Min.`;
    if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
    if (s < 86400 * 2) return "gestern";
    if (s < 86400 * 30) return `vor ${Math.round(s / 86400)} Tagen`;
    return new Date(t).toLocaleDateString("de-DE", { day: "numeric", month: "short" });
  }
  function since(t) {
    const s = (now() - new Date(t)) / 1000;
    if (s < 60) return "seit Sekunden";
    if (s < 3600) return `seit ${Math.round(s / 60)} Min.`;
    if (s < 86400) return `seit ${Math.round(s / 3600)} Std.`;
    return `seit ${Math.round(s / 86400)} Tagen`;
  }
  const fmtTime = iso => iso ? new Date(iso).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  const fmtNum = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(".", ",") + " Mio." : n >= 1e4 ? Math.round(n / 1000) + " Tsd." : n.toLocaleString("de-DE");
  const groupKey = s => s.scratch ? "~scratch" : s.cwd.toLowerCase();
  const groupName = s => s.scratch ? "Ohne Ordner" : s.project;
  const colorOf = key => PALETTE[hash(key) % PALETTE.length];
  function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  const planInfo = p => !p || !p.length ? null : { done: p.filter(x => x.st === "completed").length, total: p.length, cur: p.find(x => x.st === "in_progress") };

  // Kleiner Markdown-Leser für Verläufe: Codeblöcke, Inline-Code, Fett, Überschriften, Listen
  function md(text) {
    const parts = String(text).split(/```[^\n]*\n?/);
    return parts.map((p, i) => {
      if (i % 2) return `<pre>${esc(p.replace(/\n$/, ""))}</pre>`;
      const lines = esc(p).split("\n");
      let html = "", list = false;
      for (let l of lines) {
        l = l.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
        const li = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
        if (li) { if (!list) { html += "<ul>"; list = true; } html += `<li>${li[1]}</li>`; continue; }
        if (list) { html += "</ul>"; list = false; }
        const h = l.match(/^#{1,4}\s+(.*)/);
        if (h) html += `<h4>${h[1]}</h4>`;
        else if (l.trim()) html += `<p>${l}</p>`;
      }
      return html + (list ? "</ul>" : "");
    }).join("");
  }

  // ---------- Ansicht: Cockpit oder Karte ----------
  function setMode(mode) {
    document.body.classList.toggle("mode-cockpit", mode === "cockpit");
    document.body.classList.toggle("mode-map", mode !== "cockpit");
    $("mCockpit").setAttribute("aria-selected", mode === "cockpit");
    $("mMap").setAttribute("aria-selected", mode !== "cockpit");
    store.set("sc-mode", mode);
    if (mode !== "cockpit") { stopTour(); resize(); if (!firstLoad) showAll(); }
    else stopTour();
    renderList(); renderOverview(); dirty = true;
  }
  $("mCockpit").onclick = () => setMode("cockpit");
  $("mMap").onclick = () => setMode("map");
  // Eine Session zeigen: im Cockpit öffnen, auf der Karte hinfliegen
  function goTo(id, focus) {
    if (isCockpit()) openLog(id, focus);
    else { flyToCard(id, 1.25); if (focus) openLog(id, focus); }
  }

  // ---------- Layout: Projekte als Sternbilder ----------
  function layoutCluster(items, key) {
    const sorted = [...items].sort((a, b) => (a.start || a.end).localeCompare(b.start || b.end));
    const n = sorted.length, cols = Math.max(1, Math.ceil(Math.sqrt(n * 1.4)));
    const rows = Math.ceil(n / cols);
    const pos = sorted.map((s, i) => {
      const r = rand(hash(s.id)), row = Math.floor(i / cols), col = i % cols;
      return {
        id: s.id,
        x: col * CELL_W + (row % 2 ? CELL_W / 2 : 0) + (r() - .5) * 50 - ((cols - 1) * CELL_W + (rows > 1 ? CELL_W / 2 : 0)) / 2 - CARD_W / 2,
        y: row * CELL_H + (r() - .5) * 40 - ((rows - 1) * CELL_H) / 2 - CARD_H / 2,
      };
    });
    let rad = 0, top = Infinity;
    for (const p of pos) {
      for (const [dx, dy] of [[0, 0], [CARD_W, 0], [0, CARD_H], [CARD_W, CARD_H]]) rad = Math.max(rad, Math.hypot(p.x + dx, p.y + dy));
      top = Math.min(top, p.y);
    }
    return { pos, r: rad + 70, top };
  }

  function computeLayout(list) {
    const groups = new Map();
    for (const s of list) {
      const k = groupKey(s);
      if (!groups.has(k)) groups.set(k, { key: k, name: groupName(s), path: s.scratch ? "Sessions ohne Projektordner" : s.cwd, items: [] });
      groups.get(k).items.push(s);
    }
    const fresh = [...groups.keys()].filter(k => !clusterOrder.includes(k))
      .sort((a, b) => (groups.get(b).items[0].end || "").localeCompare(groups.get(a).items[0].end || ""));
    clusterOrder = [...clusterOrder.filter(k => groups.has(k)), ...fresh];

    const placed = [];
    nodes.forEach(n => n.keep = false);
    for (const key of clusterOrder) {
      const g = groups.get(key), inner = layoutCluster(g.items, key);
      let cx = 0, cy = 0;
      if (placed.length) {
        for (let t = 0; t < 4000; t++) {
          const a = t * 0.31 + hash(key) % 7, d = 60 + t * 16;
          cx = Math.cos(a) * d; cy = Math.sin(a) * d * 0.78;
          if (placed.every(p => Math.hypot(p.cx - cx, p.cy - cy) >= p.r + inner.r + CLUSTER_GAP)) break;
        }
      }
      const c = colorOf(key);
      const cl = { key, name: g.name, path: g.path, c, cx, cy, r: inner.r, top: cy + inner.top, ids: inner.pos.map(p => p.id) };
      placed.push(cl);
      for (const p of inner.pos) {
        const s = byId.get(p.id);
        const n = nodes.get(p.id) || { flareAt: 0, born: 0 };
        Object.assign(n, { s, x: cx + p.x, y: cy + p.y, cx: cx + p.x + CARD_W / 2, cy: cy + p.y + CARD_H / 2, c, cluster: cl, keep: true });
        nodes.set(p.id, n);
      }
    }
    for (const [id, n] of nodes) if (!n.keep) { n.el?.remove(); nodes.delete(id); }
    clusters = placed;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, r = 0;
    for (const c of clusters) {
      x0 = Math.min(x0, c.cx - c.r); y0 = Math.min(y0, c.cy - c.r); x1 = Math.max(x1, c.cx + c.r); y1 = Math.max(y1, c.cy + c.r);
      r = Math.max(r, Math.hypot(c.cx, c.cy) + c.r);
    }
    bounds = clusters.length ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0, r } : { x: -500, y: -500, w: 1000, h: 1000, r: 700 };
  }

  // ---------- Karten auf der Sternkarte ----------
  function curveSvg(curve, c) {
    const max = Math.max(1, ...curve), n = curve.length, W = 344, H = 46;
    const pts = curve.map((v, i) => [(i / (n - 1)) * W, H - 3 - (v / max) * (H - 8)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const gid = "g" + Math.random().toString(36).slice(2, 8);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Aktivität über die Dauer der Session">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" y1="${H - 2}" x2="${W}" y2="${H - 2}" stroke="#263766" stroke-width="1"/>
      <path d="${line} L${W} ${H - 2} L0 ${H - 2} Z" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    </svg>`;
  }

  // Claude schreibt die Kosten nur, wenn ein Prozess endet; sie können hinter dem Verlauf zurückliegen
  const costHint = s => `Kosten, Stand: Ende des letzten Laufs${s.costAt ? ` (${fmtTime(s.costAt)})` : ""}`;
  function cardHtml(s, c) {
    const preview = s.preview.map(m => m.r === "tools"
      ? `<div class="msg tools">${m.tools.slice(-4).map(t => `<i>${esc(t.name)}</i> ${esc(t.hint.slice(0, 60))}`).join("<br>")}</div>`
      : m.r === "note" ? `<div class="msg tools">${esc(m.t)}</div>`
      : `<div class="msg ${m.r}"><div class="clip">${md(m.t)}</div></div>`).join("");
    return `
      <div class="card-head">
        <div class="card-kicker"><span class="dot"></span><span class="proj">${esc(groupName(s))}</span>
          ${runTag(s)}<span class="when">${ago(s.end)}</span></div>
        <div class="card-title">${esc(s.title)}</div>
      </div>
      <div class="card-body">
        <div class="summary">
          ${s.lastPrompt || s.firstPrompt ? `<div class="prompt">${esc(s.lastPrompt || s.firstPrompt)}</div>` : ""}
          <div class="curve">${curveSvg(s.curve, c)}</div>
          <div class="figures">
            <div class="fig"><b>${s.userMsgs}</b><span>Prompts</span></div>
            <div class="fig"><b>${fmtNum(s.toolCalls)}</b><span>Tool-Aufrufe</span></div>
            <div class="fig"><b>${fmtNum(s.outTokens)}</b><span>Tokens erzeugt</span></div>
            ${s.cost != null ? `<div class="fig extra" title="${esc(costHint(s))}"><b>$${s.cost.toFixed(2)}</b><span>Kosten, Stand</span></div>` : ""}
          </div>
        </div>
        <div class="preview">${preview}</div>
      </div>
      <div class="card-foot">
        <code>${esc(s.id.slice(0, 8))}</code>
        <button data-open title="${esc(openHint(s))}">${OPEN_LABEL[s.opener.kind]}</button>
        <button data-log>Weiterarbeiten</button>
      </div>`;
  }

  function renderCards() {
    if (isCockpit()) return; // die Karte ist nicht zu sehen
    for (const [id, n] of nodes) {
      const s = n.s;
      if (!n.el) {
        n.el = document.createElement("div");
        n.el.className = "card";
        n.el.dataset.id = id;
        world.appendChild(n.el);
      }
      const r = runs.get(id);
      const sig = [s.end, s.sizeKB, s.active, ago(s.end), n.c, stateFor(s).kind, r ? r.status + (r.pending || []).length : ""].join("|");
      if (sig !== n.sig) {
        const pv = n.el.querySelector(".preview");
        const stick = !pv || pv.scrollTop + pv.clientHeight >= pv.scrollHeight - 24;
        const top = pv ? pv.scrollTop : 0;
        n.el.innerHTML = cardHtml(s, n.c);
        const np = n.el.querySelector(".preview");
        requestAnimationFrame(() => { np.scrollTop = stick ? np.scrollHeight : top; });
        n.sig = sig;
      }
      n.el.style.cssText = `left:${n.x}px;top:${n.y}px;--c:${n.c}`;
      n.el.classList.toggle("live", s.active || isBusy(r));
      n.el.classList.toggle("asking", isAsking(r));
      n.el.classList.toggle("selected", id === selectedId);
      n.el.classList.toggle("dim", !matches(s));
    }
  }

  // Ein Filter für alles: Liste, Übersicht, Karte, Rundflug
  const filt = { text: "", status: "all", origin: "all", since: "all", sort: "state" };
  const SINCE_MS = { day: 864e5, week: 7 * 864e5, month: 30 * 864e5 };
  const filtering = () => filt.text || filt.status !== "all" || filt.origin !== "all" || filt.since !== "all";
  function matches(s) {
    const k = stateFor(s).kind;
    if (filt.status === "needs" && k !== "needs_you" && k !== "stalled") return false;
    if (filt.status === "working" && k !== "working") return false;
    if (filt.status === "done" && k !== "done") return false;
    if (filt.status === "connected" && !runs.has(s.id)) return false;
    if (filt.origin !== "all" && s.opener.from !== filt.origin) return false;
    if (filt.since !== "all" && now() - new Date(s.end) > SINCE_MS[filt.since]) return false;
    if (filt.text) {
      const hay = `${s.title} ${groupName(s)} ${s.lastPrompt || ""} ${s.firstPrompt || ""} ${s.branch || ""} ${notes[s.id] || ""}`.toLowerCase();
      if (!filt.text.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  function counts() {
    const c = { needs: 0, stalled: 0, working: 0, done: 0 };
    for (const s of sessions) {
      const k = stateFor(s).kind;
      if (k === "needs_you") c.needs++; else if (k === "stalled") c.stalled++; else if (k === "working") c.working++; else if (k === "done") c.done++;
    }
    return c;
  }
  function renderCounts() {
    const c = counts();
    const btn = (st, cls, n, label) => `<button class="count ${cls}${n ? "" : " zero"}" data-status="${st}" aria-pressed="${filt.status === st}"><b>${n}</b><span>${label}</span></button>`;
    $("counts").innerHTML = btn("needs", "ask", c.needs + c.stalled, c.needs + c.stalled === 1 ? "braucht dich" : "brauchen dich")
      + btn("working", "on", c.working, c.working === 1 ? "arbeitet" : "arbeiten")
      + btn("done", "done", c.done, "fertig, ungelesen");
    document.title = c.needs + c.stalled ? `(${c.needs + c.stalled}) Session Canvas` : "Session Canvas";
  }
  $("counts").addEventListener("click", e => {
    const b = e.target.closest("[data-status]");
    if (!b) return;
    setStatus(filt.status === b.dataset.status ? "all" : b.dataset.status);
  });

  // ---------- Kamera ----------
  let dirty = true;
  function setView(x, y, k) { view.x = x; view.y = y; view.k = clamp(k, MIN_K, MAX_K); dirty = true; }
  function zoomAt(px, py, f) {
    const k = clamp(view.k * f, MIN_K, MAX_K);
    setView(px - (px - view.x) * (k / view.k), py - (py - view.y) * (k / view.k), k);
  }
  const toWorld = (sx, sy) => [(sx - view.x) / view.k, (sy - view.y) / view.k];

  // Flug nach van Wijk & Nuij: erst raus, dann rüber, dann rein
  let flight = null;
  function flyTo(target, opts = {}) {
    stopMotion();
    const vw = innerWidth, vh = innerHeight;
    const p0 = [(vw / 2 - view.x) / view.k, (vh / 2 - view.y) / view.k, vw / view.k];
    const p1 = [(vw / 2 - target.x) / target.k, (vh / 2 - target.y) / target.k, vw / target.k];
    const interp = zoomPath(p0, p1);
    const dur = reduced ? 0 : clamp(interp.duration * (opts.speed || 1), 450, 2600);
    flight = { interp, t0: performance.now(), dur, done: opts.done };
    dirty = true;
  }
  function zoomPath(p0, p1) {
    const rho = Math.SQRT2, rho2 = 2, rho4 = 4;
    const [ux0, uy0, w0] = p0, [ux1, uy1, w1] = p1, dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx * dx + dy * dy;
    let f, S;
    if (d2 < 1e-12) {
      S = Math.log(w1 / w0) / rho;
      f = t => [ux0 + t * dx, uy0 + t * dy, w0 * Math.exp(rho * t * S)];
    } else {
      const d1 = Math.sqrt(d2);
      const b0 = (w1 * w1 - w0 * w0 + rho4 * d2) / (2 * w0 * rho2 * d1);
      const b1 = (w1 * w1 - w0 * w0 - rho4 * d2) / (2 * w1 * rho2 * d1);
      const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
      S = (r1 - r0) / rho;
      f = t => {
        const s = t * S, c0 = Math.cosh(r0);
        const u = w0 / (rho2 * d1) * (c0 * Math.tanh(rho * s + r0) - Math.sinh(r0));
        return [ux0 + u * dx, uy0 + u * dy, w0 * c0 / Math.cosh(rho * s + r0)];
      };
    }
    f.duration = Math.abs(S) * 1000;
    return f;
  }
  const TOP_PAD = 70;
  function freeArea() {
    let left = 0, right = 0;
    if (document.body.classList.contains("side-open") && innerWidth > 900) left = $("side").getBoundingClientRect().right;
    if ($("log").classList.contains("open")) right = Math.min(600, innerWidth);
    if (innerWidth - left - right < 320) { left = 0; right = 0; }
    return { left, w: innerWidth - left - right };
  }
  function fitBox(x, y, w, h, margin, maxK) {
    const { left, w: vw } = freeArea(), vh = innerHeight - TOP_PAD;
    const k = clamp(Math.min((vw - margin * 2) / w, (vh - margin * 2) / h), MIN_K, maxK);
    return { k, x: left + vw / 2 - (x + w / 2) * k, y: TOP_PAD + vh / 2 - (y + h / 2) * k };
  }
  const allView = () => fitBox(bounds.x, bounds.y - 80, bounds.w, bounds.h + 80, 40, 0.6);
  const showAll = () => flyTo(allView());
  function cardView(id, k) {
    const n = nodes.get(id);
    return n ? fitBox(n.x, n.y, CARD_W, CARD_H, 50, k || 1.6) : null;
  }
  function flyToCard(id, k, opts) { const v = cardView(id, k); if (v) { select(id); flyTo(v, opts); } }

  let velocity = null, wheelGoal = null;
  function stopMotion() { flight = null; velocity = null; wheelGoal = null; }

  // ---------- Himmel zeichnen ----------
  const stars = [];
  { const r = rand(7); for (let i = 0; i < 420; i++) stars.push({ x: r(), y: r(), s: r() * r() * 1.6 + .3, p: r() * 6.28, d: r() * .5 + .2 }); }
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    sky.width = W * dpr; sky.height = H * dpr;
    dirty = true;
  }

  function starRadius(s) { return clamp(2.2 + Math.sqrt(s.userMsgs) * 1.1, 2.5, 11); }
  function recencyGlow(s) {
    const h = (now() - new Date(s.end)) / 36e5;
    return clamp(1 - Math.log10(1 + h) / 3.4, 0.18, 1);
  }

  function drawSky(t) {
    const g = ctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = g.createRadialGradient(W * .5, H * .45, 0, W * .5, H * .5, Math.max(W, H) * .8);
    bg.addColorStop(0, "#111f45"); bg.addColorStop(.6, "#0b1634"); bg.addColorStop(1, "#060c20");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    for (const st of stars) {
      const x = ((st.x * W + view.x * st.d * 0.08) % W + W) % W;
      const y = ((st.y * H + view.y * st.d * 0.08) % H + H) % H;
      const tw = reduced ? .7 : .55 + .45 * Math.sin(t / 900 * st.d + st.p);
      g.fillStyle = `rgba(239,230,207,${.35 * tw * st.d * 1.6})`;
      g.fillRect(x, y, st.s, st.s);
    }

    const k = view.k, sx = x => x * k + view.x, sy = y => y * k + view.y;
    const starA = 1 - smooth(CARD_IN[0] - .04, CARD_IN[1] - .06, k);

    const ox = sx(0), oy = sy(0);
    let step = 300; while (step * k < 130) step *= 2; while (step * k > 260) step /= 2;
    const far = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(ox, H - oy), Math.hypot(W - ox, H - oy));
    g.lineWidth = 1;
    g.strokeStyle = "rgba(201,168,106,.075)";
    const rings = Math.min(60, Math.ceil(far / (step * k)));
    for (let i = 1; i <= rings; i++) { g.beginPath(); g.arc(ox, oy, i * step * k, 0, Math.PI * 2); g.stroke(); }
    g.strokeStyle = "rgba(201,168,106,.05)";
    for (let a = 0; a < 24; a++) {
      const ang = a * Math.PI / 12, c = Math.cos(ang), s = Math.sin(ang);
      g.beginPath(); g.moveTo(ox + c * step * k, oy + s * step * k); g.lineTo(ox + c * far, oy + s * far); g.stroke();
    }

    for (const c of clusters) {
      const x = sx(c.cx), y = sy(c.cy), r = c.r * k * 1.25;

          g.lineWidth = 1.4;

  function stepMap(dx, dy) {

  function score(s, q) {

      const t = s.title.toLowerCase(), p = groupName(s).toLowerCase(), body = `${s.firstPrompt || ""} ${s.lastPrompt || ""} ${s.branch || ""} ${s.id} ${notes[s.id] || ""}`.toLowerCase();

  function renderFinder(q, textHits) {
    fItems = [...fHits.map(s => ({ id: s.id })), ...(textHits || []).map(h => ({ id: h.id, ts: h.ts, q }))];
    const words = q.split(/\s+/).filter(w => w.length > 1).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    const mark = t => words.length ? esc(t).replace(new RegExp(words.join("|"), "gi"), m => `<mark>${m}</mark>`) : esc(t);

  async function fillLog(id, toBottom, focus) {

  function markWord(el, q) {
    const w = q.toLowerCase().split(/\s+/).find(x => x.length > 1);
    if (!w) return null;
    const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n = walk.nextNode(); n; n = walk.nextNode()) {
      if (n.parentElement.closest(".who")) continue;
      const i = n.textContent.toLowerCase().indexOf(w);
      if (i < 0) continue;
      const range = document.createRange();
      range.setStart(n, i); range.setEnd(n, i + w.length);
      const mark = document.createElement("mark");
      range.surroundContents(mark);
      return mark;
    }
    return null;
  }

  // ---------- Geänderte Dateien ----------

  function renderList() {
    const list = sessions.filter(matches);
    $("bList").innerHTML = `Liste${filtering() ? ` (${list.length} von ${sessions.length})` : ""}<kbd>L</kbd>`;
    $("bList").setAttribute("aria-pressed", sideOpen());
    const c = counts();

  // ---------- Übersicht: alle Sessions als Kacheln ----------
  function tileHtml(s) {
    const st = stateFor(s), d = STATES[st.kind], pi = planInfo(s.plan), note = notes[s.id], r = runs.get(s.id);
    const actions = [];
    if (st.ours && st.pending) {
      if (st.pending.tool === "AskUserQuestion") actions.push(`<button type="button" class="btn primary" data-act="open">Frage beantworten</button>`);
      else actions.push(`<button type="button" class="btn primary" data-act="allow" data-req="${esc(st.pending.requestId)}">Erlauben</button>

    if (st.kind === "working" && r) actions.push(`<button type="button" class="btn" data-act="stop">Stoppen</button>`);
    if (CAN_ARCHIVE.has(st.kind) && !st.ours) actions.push(`<button type="button" class="btn" data-act="archive">Archivieren</button>`);

      <h3>${esc(s.title)}</h3>
      ${st.detail ? `<p class="det">${esc(st.detail)}</p>` : s.lastPrompt ? `<p class="det">Zuletzt: ${esc(s.lastPrompt)}</p>` : ""}
      ${pi ? `<div class="plan-bar"><i style="width:${Math.round(pi.done / pi.total * 100)}%"></i></div><div class="plan-line">${pi.done} von ${pi.total}${pi.cur ? `: ${esc(pi.cur.t)}` : ""}</div>` : ""}
