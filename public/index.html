  // Archivieren: die Session wandert aus "Braucht dich" ins Archiv, bis sich in ihr wieder etwas tut
  const CAN_ARCHIVE = new Set(["needs_you", "stalled", "done"]);
  async function setArchived(id, on) {
    await post(`/api/sessions/${encodeURIComponent(id)}/${on ? "archive" : "unarchive"}`);
    const s = byId.get(id);
    if (on && s && s.state) s.state.kind = "archived";
    prevKinds.delete(id); // eigene Aktion, keine Benachrichtigung beim Zurückholen
    renderList(); renderCounts(); renderOverview(); if (logId === id) renderPaneHead();
  }
  function renderOverview() {
    if (!isCockpit() || logId) return;
    const list = sessions.filter(matches).sort(SORTS.state);
    const box = $("overview"), top = box.scrollTop;
    if (!list.length) {
      box.innerHTML = sessions.length
        ? `<div class="ov-empty"><strong>Nichts passt zu diesem Filter</strong><button type="button" class="btn" data-reset>Filter zurücksetzen</button></div>`
        : `<div class="ov-empty"><strong>Noch keine Sessions</strong>Starte eine mit „Neue Session“, sie erscheint dann hier.</div>`;
      return;
    }
    let html = "", lastKind = null;
    for (const s of list) {
      const kind = stateFor(s).kind;
      if (kind !== lastKind) {
        if (lastKind) html += `</div></section>`;
        lastKind = kind;
        const n = list.filter(x => stateFor(x).kind === kind).length;
        html += `<section class="ov-sect ${STATES[kind].cls}"><h2>${STATES[kind].label}<small>${n}</small></h2><div class="tiles">`;
      }
      html += tileHtml(s);
    }
    box.innerHTML = html + `</div></section>`;
    box.scrollTop = top;
  }
  $("overview").addEventListener("click", async e => {
    if (e.target.closest("[data-reset]")) return resetFilter();
    const tile = e.target.closest(".tile");
    if (!tile) return;
    const id = tile.dataset.id, act = e.target.closest("[data-act]");
    if (!act) return openLog(id);
    e.stopPropagation();
    const a = act.dataset.act;
    try {
      if (a === "allow" || a === "deny") { act.disabled = true; await post(`/api/sessions/${encodeURIComponent(id)}/permission`, { requestId: act.dataset.req, allow: a === "allow" }); }
      else if (a === "reply") sendText(id, act.dataset.reply);
      else if (a === "seen") { const s = byId.get(id); if (s && s.state) { s.state.unread = false; s.state.kind = "idle"; } post(`/api/sessions/${encodeURIComponent(id)}/seen`).catch(() => {}); renderList(); renderCounts(); renderOverview(); }
      else if (a === "stop") await post(`/api/sessions/${encodeURIComponent(id)}/interrupt`);
      else if (a === "archive" || a === "unarchive") await setArchived(id, a === "archive");
      else if (a === "elsewhere") openElsewhere(id);
      else openLog(id);
    } catch (err) { pushFeed(id, byId.get(id)?.title || id, err.message, () => openLog(id)); }
  });
  $("overview").addEventListener("keydown", e => { const t = e.target.closest(".tile"); if (t && e.key === "Enter" && e.target === t) openLog(t.dataset.id); });

  // ---------- Neue Session ----------
  let pendingOpen = null;
  function projectFolders() {
    const seenCwd = new Map();
    for (const s of [...sessions].sort(SORTS.recent)) if (!s.scratch && s.cwd && !seenCwd.has(s.cwd.toLowerCase())) seenCwd.set(s.cwd.toLowerCase(), s);
    return [...seenCwd.values()];
  }
  function openNew(cwd) {
    stopTour();
    const folders = projectFolders(), sel = byId.get(logId || selectedId);
    const pre = cwd || (sel && !sel.scratch ? sel.cwd : folders[0] && folders[0].cwd);
    $("nProj").innerHTML = folders.map(s => `<option value="${esc(s.cwd)}">${esc(groupName(s))}  (${esc(s.cwd)})</option>`).join("")
      + `<option value="">Anderer Ordner …</option>`;
    $("nProj").value = folders.some(f => f.cwd === pre) ? pre : "";
    $("nPath").hidden = $("nProj").value !== "";
    $("nState").textContent = ""; $("nState").className = "state";
    $("newDlg").classList.add("open");
    ($("nPath").hidden ? $("nText") : $("nPath")).focus();
  }
  function closeNew() { $("newDlg").classList.remove("open"); }
  $("nProj").onchange = () => { $("nPath").hidden = $("nProj").value !== ""; if (!$("nPath").hidden) $("nPath").focus(); };
  $("nCancel").onclick = closeNew;
  $("bNew").onclick = () => openNew();
  $("newDlg").addEventListener("click", e => { if (e.target.id === "newDlg") closeNew(); });
  $("newDlg").addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); closeNew(); } });
  $("nText").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("newForm").requestSubmit(); } });
  $("newForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cwd = $("nProj").value || $("nPath").value.trim(), text = $("nText").value.trim();
    const st = $("nState");
    if (!cwd || !text) { st.textContent = !cwd ? "Welcher Ordner?" : "Schreib Claude, womit es anfangen soll."; st.className = "state ask"; return; }
    $("nGo").disabled = true; st.textContent = "Startet …"; st.className = "state on";
    try {
      const r = await post("/api/new", { cwd, text, mode: $("nMode").value });
      pendingOpen = r.id;
      $("nText").value = "";
      closeNew();
      pushFeed(r.id, "Neue Session", `startet in ${cwd}.`, () => {});
      load();
    } catch (err) { st.textContent = err.message; st.className = "state ask"; }
    $("nGo").disabled = false;
  });

  // ---------- Weiterarbeiten: Nachrichten senden, Erlaubnisse geben ----------
  let consoleError = "", permsKey = "", settingsKey = "";

  function renderLive() {
    if (!logId) return;
    const box = $("logStream"), r = runs.get(logId), text = partials.get(logId) || "";
    let el = box.querySelector(".msg.live");
    if (!text && !isBusy(r)) { el?.remove(); return; }
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    if (!el) { el = document.createElement("div"); el.className = "msg assistant live"; }
    box.appendChild(el);
    el.innerHTML = `<span class="who">Claude, gerade eben</span>${text ? md(text) : ""}`;
    if (stick) box.scrollTop = box.scrollHeight;
  }

  function permHtml(p) {
    const i = p.input || {};
    if (p.tool === "AskUserQuestion" && Array.isArray(i.questions)) {
      return `<div class="perm" data-req="${esc(p.requestId)}"><h3>Claude hat eine Frage an dich</h3>
        ${i.questions.map((q, qi) => `<div class="q" data-q="${qi}" data-multi="${q.multiSelect ? 1 : 0}"><p>${esc(q.question)}</p><div class="opts">
          ${(q.options || []).map(o => `<button type="button" class="btn" data-opt="${esc(o.label)}" aria-pressed="false" title="${esc(o.description || "")}">${esc(o.label)}</button>`).join("")}
        </div></div>`).join("")}
        <div class="row"><button type="button" class="btn" data-deny>Nicht beantworten</button><button type="button" class="btn primary" data-answer>Antworten</button></div></div>`;
    }
    let what;
    if (i.command) what = i.command;
    else if (i.file_path && i.old_string != null) what = `${i.file_path}\n\n− ${String(i.old_string).slice(0, 700)}\n\n+ ${String(i.new_string || "").slice(0, 700)}`;
    else if (i.file_path) what = i.file_path + (i.content ? "\n\n" + String(i.content).slice(0, 900) : "");
    else if (i.url) what = i.url;
    else what = JSON.stringify(i, null, 2).slice(0, 1400);
    return `<div class="perm" data-req="${esc(p.requestId)}">
      <h3>Claude möchte <b>${esc(p.display || p.tool)}</b> verwenden</h3>
      ${i.description ? `<p class="q">${esc(i.description)}</p>` : ""}
      <pre>${esc(what)}</pre>
      <div class="row"><button type="button" class="btn" data-deny>Ablehnen</button><button type="button" class="btn primary" data-allow>Erlauben</button></div></div>`;
  }

  function renderConsole() {
    if (!logId) return;
    const s = byId.get(logId), r = runs.get(logId);
    const pending = (r && r.pending) || [];
    const key = pending.map(p => p.requestId).join(",");
    if (key !== permsKey) { permsKey = key; $("perms").innerHTML = pending.map(permHtml).join(""); }
    const notesHtml = [];
    if (consoleError) notesHtml.push(`<div class="notice error">${esc(consoleError)}</div>`);
    if (r && r.error) notesHtml.push(`<div class="notice error">${esc(r.error)}</div>`);
    if (s && s.split) notesHtml.push(`<div class="notice">Der Verlauf dieser Session hat sich aufgespalten, etwa weil zwei Programme gleichzeitig geschrieben haben oder in der Claude-App zurückgesprungen wurde. Angezeigt wird nur der Zweig, der zuletzt weitergeschrieben wurde. Mit ihm macht auch „Weiterarbeiten“ weiter.</div>`);
    if (s && elsewhere(s)) notesHtml.push(`<div class="notice">Diese Session war gerade eben woanders aktiv, etwa in der Claude-App oder einem Terminal. Schreibst du hier, arbeiten zwei Programme im selben Verlauf und er kann sich aufspalten. Am sichersten wartest du, bis sie dort fertig ist.</div>`);
    $("notice").innerHTML = notesHtml.join("");
    const st = $("cState"), busy = isBusy(r);
    st.className = "state" + (pending.length ? " ask" : busy ? " on" : "");
    st.textContent = !r ? "Die erste Nachricht setzt diese Session fort."
      : pending.length ? "Wartet auf deine Antwort"
      : r.status === "starting" ? "Claude startet …"
      : busy ? (r.note ? `Arbeitet: ${r.note}` : "Arbeitet …")
      : r.status === "closing" ? "Wird getrennt …"
      : "Fertig. Bereit für die nächste Nachricht.";
    st.title = st.textContent;
    $("cStop").hidden = !busy && !pending.length;
    $("cRelease").hidden = !r || busy || pending.length > 0;
    if (r && r.mode) $("cMode").value = r.mode;
    // Modell und Effort nur übernehmen, wenn Session oder Prozess wechseln, sonst geht deine Auswahl verloren
    const settingsNow = `${logId}|${r ? `${r.model}|${r.effort}` : "-"}`;
    if (settingsNow !== settingsKey) {
      settingsKey = settingsNow;
      $("cModel").value = (r && r.model) || "";
      $("cEffort").value = (r && r.effort) || "";
    }
    $("cModel").options[0].textContent = s && s.model ? `Modell der Session (${s.model.replace(/^claude-/, "")})` : "Modell der Session";
    $("cSend").textContent = s && elsewhere(s) ? "Trotzdem senden" : busy ? "Nachschieben" : "Senden";
  }

  async function sendText(id, text) {
    text = String(text || "").trim();
    if (!id || !text) return;
    if (logId !== id) openLog(id);
    $("cSend").disabled = true;
    consoleError = "";
    const box = $("logStream"), pend = document.createElement("div");
    pend.className = "msg user sending";
    pend.innerHTML = `<span class="who">Du, wird gesendet</span>${md(text)}`;
    box.querySelector(".msg.live") ? box.insertBefore(pend, box.querySelector(".msg.live")) : box.appendChild(pend);
    box.scrollTop = box.scrollHeight;
    try {
      await post(`/api/sessions/${encodeURIComponent(id)}/send`, { text, mode: $("cMode").value, model: $("cModel").value, effort: $("cEffort").value });
      if ($("cInput").value.trim() === text) { $("cInput").value = ""; autosize(); }
    } catch (err) {
      pend.remove();
      consoleError = err.message;
    }
    $("cSend").disabled = false;
    renderConsole();
  }
  function autosize() { const t = $("cInput"); t.style.height = "auto"; t.style.height = Math.min(180, t.scrollHeight + 2) + "px"; }
  $("cInput").addEventListener("input", autosize);
  $("cInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
  });
  $("composer").addEventListener("submit", e => { e.preventDefault(); sendText(logId, $("cInput").value); });
  $("cStop").onclick = () => logId && post(`/api/sessions/${encodeURIComponent(logId)}/interrupt`).catch(err => { consoleError = err.message; renderConsole(); });
  $("cRelease").onclick = () => logId && post(`/api/sessions/${encodeURIComponent(logId)}/release`).catch(err => { consoleError = err.message; renderConsole(); });

  $("perms").addEventListener("click", async e => {
    const box = e.target.closest(".perm");
    if (!box || !logId) return;
    const opt = e.target.closest("[data-opt]");
    if (opt) {
      const q = opt.closest(".q");
      if (q.dataset.multi === "1") opt.setAttribute("aria-pressed", opt.getAttribute("aria-pressed") !== "true");
      else q.querySelectorAll("[data-opt]").forEach(b => b.setAttribute("aria-pressed", b === opt));
      return;
    }
    const req = box.dataset.req;
    let body = null;
    if (e.target.closest("[data-allow]")) body = { requestId: req, allow: true };
    else if (e.target.closest("[data-deny]")) body = { requestId: req, allow: false };
    else if (e.target.closest("[data-answer]")) {
      const p = (runs.get(logId)?.pending || []).find(x => x.requestId === req);
      if (!p) return;
      const answers = {};
      box.querySelectorAll(".q[data-q]").forEach(q => {
        const picked = [...q.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.opt);
        if (picked.length) answers[p.input.questions[+q.dataset.q].question] = picked.join(", ");
      });
      if (!Object.keys(answers).length) return;
      body = { requestId: req, allow: true, answers };
    }
    if (!body) return;
    box.querySelectorAll("button").forEach(b => b.disabled = true);
    try { await post(`/api/sessions/${encodeURIComponent(logId)}/permission`, body); }
    catch (err) { consoleError = err.message; permsKey = ""; renderConsole(); }
  });

  // ---------- Benachrichtigen ----------
  function setPref(k, v) { prefs[k] = v; store.set("sc-prefs", prefs); $("bNotify").setAttribute("aria-pressed", !!prefs.notify); $("bSound").setAttribute("aria-pressed", !!prefs.sound); }
  $("bNotify").onclick = async () => {
    if (prefs.notify) return setPref("notify", false);
    if (!("Notification" in window)) { pushFeed("sys", "Benachrichtigungen", "Dieser Browser kann keine Desktop-Benachrichtigungen zeigen.", () => {}); return; }
    const p = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if (p === "granted") setPref("notify", true);
    else pushFeed("sys", "Benachrichtigungen", "Der Browser hat Benachrichtigungen für diese Seite nicht erlaubt.", () => {});
  };
  $("bSound").onclick = () => { setPref("sound", !prefs.sound); if (prefs.sound) beep(); };
  function beep() {
    try {
      const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = "sine"; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1175, t + .12);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .45);
    } catch {}
  }
  function notify(id, title, body, sound) {
    if (sound && prefs.sound) beep();
    if (!prefs.notify || !("Notification" in window) || Notification.permission !== "granted") return;
    if (!document.hidden && document.hasFocus()) return; // du schaust ohnehin hin
    try {
      const n = new Notification(title, { body, tag: "sc-" + id });
      n.onclick = () => { window.focus(); openLog(id); n.close(); };
    } catch {}
  }
  // Zustandswechsel melden: neu "braucht dich" / "hängt" (mit Ton), neu "fertig" (nur Hinweis)
  function watchTransitions() {
    for (const s of sessions) {
      const k = stateFor(s).kind, prev = prevKinds.get(s.id);
      prevKinds.set(s.id, k);
      if (!prev || prev === k || logId === s.id) continue;
      if (k === "needs_you" || k === "stalled") { notify(s.id, s.title, stateFor(s).detail, true); pushFeed(s.id, s.title, stateFor(s).detail, () => openLog(s.id), true); }
      else if (k === "done") notify(s.id, s.title, `Fertig: ${stateFor(s).detail}`.slice(0, 160), false);
    }
  }

  // ---------- Funksprüche ----------
  function ping(s) {
    const n = nodes.get(s.id);
    if (n) { n.flareAt = performance.now(); n.el?.classList.remove("flare"); void n.el?.offsetWidth; n.el?.classList.add("flare"); }
    if (logId === s.id) { fillLog(s.id, false); renderPaneHead(); return; }
  }
  function pushFeed(id, title, text, action, stay) {
    const feed = $("feed");
    feed.querySelector(`[data-id="${id}"]`)?.remove();
    const b = document.createElement("button");
    b.className = "ping"; b.dataset.id = id; b.style.setProperty("--c", byId.has(id) ? colorOf(groupKey(byId.get(id))) : "#c9a86a");
    b.innerHTML = `<strong>${esc(title)}</strong><span>${esc(String(text).slice(0, 160))}</span>`;
    b.onclick = () => { stopTour(); action(); b.remove(); };
    feed.prepend(b);
    while (feed.children.length > 4) feed.lastChild.remove();
    if (!stay) setTimeout(() => { b.classList.add("gone"); setTimeout(() => b.remove(), 700); }, 14000);
  }

  // ---------- Live-Ereignisse der von hier gesteuerten Sessions ----------
  function onRun(info) {
    const before = runs.get(info.sid);
    if (info.status === "off") runs.delete(info.sid); else runs.set(info.sid, info);
    partials.set(info.sid, info.partial || "");
    const s = byId.get(info.sid);
    const known = new Set(((before && before.pending) || []).map(p => p.requestId));
    const fresh = (info.pending || []).filter(p => !known.has(p.requestId));
    if (s && fresh.length && logId !== info.sid) {
      const p = fresh[0];
      const text = p.tool === "AskUserQuestion" ? "stellt dir eine Frage" : `fragt: darf ich ${p.display || p.tool} verwenden?`;
      notify(info.sid, s.title, text, true);
      pushFeed(info.sid, s.title, text, () => openLog(info.sid), true);
      const n = nodes.get(info.sid);
      if (n) n.flareAt = performance.now();
    }
    if (s) prevKinds.set(s.id, stateFor(s).kind);
    if (!isAsking(info)) { const f = $("feed").querySelector(`[data-id="${info.sid}"]`); if (f && /fragt:|Frage/.test(f.textContent)) f.remove(); }
    if (info.status === "off" && info.error && logId === info.sid) consoleError = info.error;
    renderCards(); renderCounts(); renderList(); renderOverview(); dirty = true;
    if (logId === info.sid) { renderPaneHead(); renderConsole(); renderLive(); }
  }
  function onDelta({ sid, text }) {
    partials.set(sid, (partials.get(sid) || "") + text);
    if (logId === sid) renderLive();
  }
  function onDone({ sid, error, note }) {
    const s = byId.get(sid);
    if (logId === sid) { fillLog(sid, false); post(`/api/sessions/${encodeURIComponent(sid)}/seen`).catch(() => {}); return; }
    if (s) { notify(sid, s.title, error ? `Fehler: ${error}` : `Fertig${note ? ": " + note : ""}`, !!error); pushFeed(sid, s.title, error ? `Fehler: ${error}` : `Fertig${note ? ": " + note : ""}`, () => openLog(sid)); }
  }

  // ---------- Daten ----------
  let loading = false, again = false, syncRuns = true;
  async function load() {
    if (loading) { again = true; return; }
    loading = true;
    try {
      const data = await (await fetch("/api/sessions")).json();
      serverSkew = data.now - Date.now();
      const prev = byId;
      sessions = data.sessions;
      byId = new Map(sessions.map(s => [s.id, s]));
      if (syncRuns) {
        syncRuns = false;
        runs.clear();
        for (const s of sessions) if (s.run) { runs.set(s.id, s.run); partials.set(s.id, s.run.partial || ""); }
      }
      // Was du hier gerade offen hast, zählt nicht als ungelesen
      if (logId && byId.has(logId) && byId.get(logId).state && byId.get(logId).state.kind === "done") { byId.get(logId).state.kind = "idle"; byId.get(logId).state.unread = false; }
      const key = sessions.map(s => s.id + groupKey(s)).sort().join("|");
      if (key !== layoutKey) { layoutKey = key; computeLayout(sessions); }
      else for (const n of nodes.values()) n.s = byId.get(n.s.id);
      if (!firstLoad) watchTransitions(); else for (const s of sessions) prevKinds.set(s.id, stateFor(s).kind);
      renderCards(); renderCounts(); renderList(); renderOverview();
      if (logId && byId.has(logId)) renderPaneHead();
      if (pendingOpen && byId.has(pendingOpen)) {
        const id = pendingOpen;
        pendingOpen = null;
        goTo(id);
      }
      document.querySelector(".empty")?.remove();
      if (!sessions.length && !isCockpit()) {
        const d = document.createElement("div");
        d.className = "empty";
        d.innerHTML = `<div><strong>Noch keine Sterne am Himmel</strong>Im Ordner <code>${esc(data.dir)}</code> liegen keine Sessions.</div>`;
        document.body.appendChild(d);
      }
      if (firstLoad) {
        firstLoad = false;
        const order = [...nodes.values()].sort((a, b) => (a.s.start || a.s.end).localeCompare(b.s.start || b.s.end));
        order.forEach((n, i) => n.born = order.length > 1 ? (i / (order.length - 1)) * .85 : 0);
        introStart = performance.now();
        const v = allView();
        setView(v.x, v.y, v.k);
      } else {
        for (const s of sessions) {
          const p = prev.get(s.id);
          if (!p || p.end !== s.end || p.sizeKB !== s.sizeKB) ping(s);
        }
      }
      dirty = true;
    } catch (err) {
      console.warn("Laden fehlgeschlagen", err);
    } finally {
      loading = false;
      if (again) { again = false; load(); }
    }
  }

  function connect() {
    let es;
    try { es = new EventSource("/api/events"); } catch { return; }
    es.onmessage = () => load();
    es.addEventListener("run", e => onRun(JSON.parse(e.data)));
    es.addEventListener("delta", e => onDelta(JSON.parse(e.data)));
    es.addEventListener("done", e => onDone(JSON.parse(e.data)));
    es.onopen = () => { syncRuns = true; load(); };
  }

  // ---------- Start ----------
  document.body.classList.toggle("side-open", store.get("sc-side", innerWidth >= 1100));
  const savedSort = store.get("sc-sort", "state");
  if (SORTS[savedSort] || savedSort === "project") filt.sort = savedSort;
  $("sSort").value = filt.sort;
  setPref("notify", prefs.notify && "Notification" in window && Notification.permission === "granted");
  setMode(store.get("sc-mode", "cockpit"));
  resize();
  requestAnimationFrame(frame);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { dirty = true; });
  load();
  connect();
  setInterval(load, 20000);
  setInterval(() => { if (!document.hidden) { renderList(); renderOverview(); if (logId) renderPaneHead(); } }, 60000); // "seit x Min." aktuell halten
})();
</script>
</body>
</html>
